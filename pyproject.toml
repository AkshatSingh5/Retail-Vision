[project]
name = "retail-vision"
version = "0.1.0"
description = "AI-powered retail product detection and automatic billing"
requires-python = ">=3.12"
# Vercel installs only this list (uv sync, no extras). Keep it web-only.
# CUDA PyTorch + ultralytics + transformers were ~5.2 GB and exceeded the
# 500 MB (and even 5 GB Large Function) bundle limit. OpenCV is also omitted:
# it crashes Vercel (missing libGL/libgthread). Scan uses Pillow + color embeddings.
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "boto3>=1.34.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.19",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "numpy==2.5.2",
    "packaging==26.3",
    "pgvector>=0.3.0",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "reportlab==5.0.0",
    "requests==2.34.2",
    "six==1.17.0",
    "SQLAlchemy==2.0.52",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
]

[project.optional-dependencies]
ml = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "filelock==3.32.3",
    "fonttools==4.63.0",
    "fsspec==2026.7.0",
    "huggingface-hub>=0.23.0",
    "kiwisolver==1.5.0",
    "matplotlib==3.11.1",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "nvidia-ml-py==13.610.43",
    "opencv-python==5.0.0.93",
    "polars==1.43.2",
    "polars-runtime-32==1.43.2",
    "psutil==7.2.2",
    "pyparsing==3.3.2",
    "safetensors>=0.4.0",
    "setuptools==84.0.0",
    "sympy==1.14.0",
    "timm>=1.0.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=4.40.0",
    "ultralytics==8.4.123",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.app.main:app"
