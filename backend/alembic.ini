# Alembic configuration for the Retail Vision backend.
#
# Prefer running via the repo helpers:
#   uv run alembic -c backend/alembic.ini upgrade head      (from repo root)
#   uv run alembic -c backend/alembic.ini revision --autogenerate -m "..."
#
# DATABASE_URL is read from the environment / .env when `sqlalchemy.url`
# below is left at its placeholder. The value below matches the application
# default (`sqlite:///./retail_vision.db` at the repo root).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# file_template = %%(rev)s_%%(slug)s
# timezone = UTC
# A plain application default; real URLs come from DATABASE_URL in .env.
sqlalchemy.url = sqlite:///./retail_vision.db
# sqlalchemy.url = postgresql+psycopg2://USER:PASSWORD@HOST:5432/DATABASE

[post_write_hooks]
# post_write_hooks = hooks
# hooks=black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S